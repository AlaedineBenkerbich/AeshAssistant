name: Release

# Publishes a signed, installable release APK as a GitHub Release using
# Calendar Versioning (CalVer: YYYY.MM.MICRO).
#
# Two ways to cut a release:
#   1. Manually run this workflow ("Run workflow" button). The next CalVer
#      version is computed automatically from existing tags, unless you
#      supply an explicit override in the `version_name` input.
#   2. Push a tag matching `v*.*.*` (e.g. `v2026.09.1`) and this workflow
#      builds + publishes the release for that exact version.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Override version (YYYY.MM.MICRO). Leave empty to auto-compute the next one."
        required: false
        default: ""
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Determine release version (CalVer)
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            # Triggered by a manually pushed tag: it is the source of truth.
            TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG#v}"
            CREATE_TAG="false"
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            # Manual dispatch with an explicit version override.
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            TAG="v${VERSION_NAME}"
            CREATE_TAG="true"
          else
            # Manual dispatch, auto-compute the next CalVer version:
            # YYYY.MM.MICRO, incrementing MICRO for extra releases in the
            # same calendar month.
            YEAR_MONTH="$(date -u +'%Y.%m')"
            LAST_MICRO="$(git tag --list "v${YEAR_MONTH}.*" | sed -E 's/.*\.([0-9]+)$/\1/' | sort -n | tail -1)"
            if [ -z "${LAST_MICRO}" ]; then
              MICRO=0
            else
              MICRO=$((10#${LAST_MICRO} + 1))
            fi
            VERSION_NAME="${YEAR_MONTH}.${MICRO}"
            TAG="v${VERSION_NAME}"
            CREATE_TAG="true"
          fi

          if ! [[ "${VERSION_NAME}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::Version '${VERSION_NAME}' does not match the CalVer format YYYY.MM.MICRO"
            exit 1
          fi

          # versionCode is derived from versionName so the two never drift
          # apart, and stays monotonically increasing release after release:
          # (YEAR * 100 + MONTH) * 1000 + MICRO
          YEAR="$(cut -d. -f1 <<< "${VERSION_NAME}")"
          MONTH="$(cut -d. -f2 <<< "${VERSION_NAME}")"
          MICRO="$(cut -d. -f3 <<< "${VERSION_NAME}")"
          VERSION_CODE=$(( (10#${YEAR} * 100 + 10#${MONTH}) * 1000 + 10#${MICRO} ))

          echo "Resolved release: name=${VERSION_NAME} code=${VERSION_CODE} tag=${TAG} create_tag=${CREATE_TAG}"
          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "tag=${TAG}"
            echo "create_tag=${CREATE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            -PappVersionCode="${{ steps.version.outputs.version_code }}" \
            --stacktrace

      - name: Prepare release artifact
        id: artifact
        run: |
          set -euo pipefail
          mkdir -p release
          OUT_NAME="AeshAssistant-${{ steps.version.outputs.version_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release/${OUT_NAME}"
          echo "path=release/${OUT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.create_tag == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.version_name }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.artifact.outputs.path }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
